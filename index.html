<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Darwin image review</title>
  <link rel="stylesheet" href="/review.css">
</head>
<body>
  <header class="topbar">
    <div><p class="eyebrow">SHINING SERVICES · DARWIN</p><h1>Image review</h1></div>
    <div class="summary" id="summary" role="status">Loading review inventory…</div>
  </header>
  <main>
    <section class="toolbar" aria-label="Review filters">
      <label>Find service or section<input id="search" type="search" placeholder="Search the review set"></label>
      <label>Service<select id="service-filter"><option value="">All services</option></select></label>
      <button id="refresh" type="button">Refresh</button>
      <span id="feedback-status" role="status" aria-live="polite"></span>
    </section>
    <section id="cards" class="cards" aria-live="polite"></section>
  </main>
  <template id="card-template">
    <article class="card">
      <div class="card-head"><div><h2 class="service"></h2><p class="title"></p></div><small class="slot"></small></div>
      <img class="preview" loading="lazy" alt="">
      <div class="version-row"><label>Version<select class="version-select"></select></label><a class="open-image" target="_blank" rel="noopener">Open full size</a></div>
      <p class="meta"></p>
      <div class="actions"><button class="like" type="button">Like 0</button><button class="dislike" type="button">Dislike 0</button><button class="approve" type="button">Approve this version</button><button class="copy" type="button">Copy image</button></div>
      <label class="comment-label">Comment on this version<textarea class="comment-input" maxlength="1500" rows="3" placeholder="Write a note about this specific version"></textarea></label>
      <button class="save-comment" type="button">Save comment</button>
      <section class="comments" aria-label="Saved comments"></section>
    </article>
  </template>
  <script type="module" src="/review.js"></script>
</body>
</html>
